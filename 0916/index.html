
<!DOCTYPE html>
<html>
  <head>
    <title>資訊三甲 柯安澤</title>
    <!-- CSS -->
    <style>
     th,td{background-color: #ff8800e7;}
     
     </style>
     <!-- JavaScript -->
     <script>
    document.write("<h1>資訊三甲 柯安澤 九九乘法表</h1>");
    document.write("<table align='center'>");
    for (let i = 1; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 1; j <= i ; j++) {
            document.write("<td>");
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
            document.write("</td>");
        }
        document.write("</tr>");
    }
    document.write("</table>");
     </script>
  </head>

</html>
